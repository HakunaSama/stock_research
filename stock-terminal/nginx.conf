# nginx: serve the built SPA and reverse-proxy the API to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with long cache; index.html stays uncached so deploys take effect.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API + health: proxy to the backend service (compose DNS name "backend").
    # Long timeouts because an online research run can take minutes — though the
    # request itself only enqueues; polling endpoints are fast.
    location ~ ^/(api|healthz) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: BrowserRouter needs unknown paths to return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

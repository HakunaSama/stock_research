# Production stack for the Stock Research Terminal.
#
#   nginx (frontend)  :  serves the built SPA + reverse-proxies /api → backend
#   backend (FastAPI) :  auth + read-only run data + online research job queue
#
# One command to run it all:  docker compose up -d --build
# Config lives in .env next to this file (copy from deploy.env.example).

services:
  backend:
    build: ./stock-research-agent
    restart: unless-stopped
    environment:
      # Where SQLite DB + run artifacts persist (inside the container).
      STOCK_DATA_DIR: /data
      # LLM credentials for ONLINE research (optional — leave blank to disable
      # the "发起深度研究" button; the site still works read-only).
      STOCK_LLM_BASE_URL: ${STOCK_LLM_BASE_URL:-}
      STOCK_LLM_API_KEY: ${STOCK_LLM_API_KEY:-}
      STOCK_LLM_MODEL: ${STOCK_LLM_MODEL:-}
      STOCK_LLM_TIMEOUT: ${STOCK_LLM_TIMEOUT:-300}
      STOCK_LLM_JSON_MODE: ${STOCK_LLM_JSON_MODE:-auto}
      # Session / research knobs.
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}      # keep 0 on plain HTTP; set 1 with HTTPS
      RESEARCH_WORKERS: ${RESEARCH_WORKERS:-1}
      RESEARCH_DAILY_QUOTA: ${RESEARCH_DAILY_QUOTA:-5}
      # Email verification codes (empty = dev mode: code echoed in response).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-1}
      # Billing / credits / membership.
      RESEARCH_CREDIT_COST: ${RESEARCH_CREDIT_COST:-1}
      SIGNUP_BONUS_CREDITS: ${SIGNUP_BONUS_CREDITS:-0}
      SUB_DAILY_QUOTA: ${SUB_DAILY_QUOTA:-20}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stub}
    volumes:
      - stock-data:/data
    expose:
      - "8000"

  frontend:
    build: ./stock-terminal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host:Container — change the left side if 80 is taken on your server.
      - "${HTTP_PORT:-80}:80"

volumes:
  stock-data:
